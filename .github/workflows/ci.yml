name: CI

on:
  push:
    branches: [feature/pdf-retrieval]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - run: yarn typecheck

      - run: yarn test

      - run: yarn build

      - run: yarn wrangler deploy --dry-run
