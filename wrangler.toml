name = "tallevin-arena-mcp"
main = "src/transports/http.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "OAUTH_KV"
# Replace with your own namespace ID. Never reuse the upstream namespace.
id = "00000000000000000000000000000000"

[[kv_namespaces]]
binding = "PDF_CACHE"
# Separate cache from OAuth state; expires automatically after seven days.
id = "00000000000000000000000000000001"

[observability]
enabled = true
